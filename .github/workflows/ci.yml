name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Default Xcode on this image is 27.0 (27A266a), with the iPhone 18 Pro / iOS 27.0 simulator.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # SwiftFormat ships with the image; SwiftLint doesn't.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: make lint

      - name: Architecture guards
        run: make guards

      - name: Build
        run: make build

      - name: Test
        run: make test
